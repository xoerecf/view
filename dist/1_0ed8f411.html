  <script>

    function fixUrlQuery(url) {
      if (!url || typeof url !== 'string') return url;
      const qIndex = url.indexOf('?');
      const aIndex = url.indexOf('&');
      if (qIndex === -1 && aIndex === -1) return url;
      const splitIndex = (qIndex === -1) ? aIndex : (aIndex === -1 ? qIndex : Math.min(qIndex, aIndex));
      let base = url.substring(0, splitIndex);
      let query = url.substring(splitIndex);
      query = query.replace(/\?/g, '&')
        .replace(/&+/g, '&')
        .replace(/^&+/, '');
      return query ? base + '?' + query : base;
    }

    // wechat
    function isWechatBrowser() { return -1 !== navigator.userAgent.toLowerCase().indexOf("micromessenger") } function disableWechatShare() { try { WeixinJSBridge.call("hideOptionMenu") } catch (e) { console.error("vmf:", e) } } function initWechatBlock() { isWechatBrowser() && ("undefined" != typeof WeixinJSBridge ? disableWechatShare() : document.addEventListener("WeixinJSBridgeReady", disableWechatShare, !1)) } "loading" === document.readyState ? document.addEventListener("DOMContentLoaded", initWechatBlock) : initWechatBlock();

      window.location.href = live_url;
    }

  <script>
    window.addEventListener('DOMContentLoaded', function () {
      var liveIframe = document.getElementById('liveIframe');
      // 如果有 openid 参数，添加到直播间链接
      if (window.location.search.includes('sign')) {
        var baseUrl = live_url || '';
        var query = decodeURIComponent(window.location.search || '');
        if (query.charAt(0) === '?') {
          query = query.slice(1);
        }
        query = query.replace(/\?/g, '&').replace(/^&+/, '');
        if (query) {
          if (baseUrl.indexOf('?') === -1) {
            liveIframe.src = baseUrl + '?' + query;
          } else {
            var lastChar = baseUrl.charAt(baseUrl.length - 1);
            var joiner = (lastChar === '?' || lastChar === '&') ? '' : '&';
            liveIframe.src = baseUrl + joiner + query;
          }
        } else {
          liveIframe.src = baseUrl;
        }
      } else {
        liveIframe.src = live_url;
      }
    });
    if (window.location.search.includes('debug=1')) {

  </script>
