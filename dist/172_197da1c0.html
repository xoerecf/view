  <script>

    // 授权站 base 地址（PHP 已预拼 "?turl="，剥掉得到干净 base；不授权时为空）
    var AUTH_BASE = ''.replace(/[?&]turl=$/, '');

    // 登记一个 query 参数，可连续调用：addParam(list, 'name', value)
    function addParam(list, name, value) {
      if (value === undefined || value === null || value === '') return list;
      list.push(encodeURIComponent(name) + '=' + encodeURIComponent(value));
      return list;
    }

    // base + 参数列表 -> 完整地址
    function buildUrl(base, list) {
      if (!base) return '';
      if (!list.length) return base;
      var sep = /[?&]$/.test(base) ? '' : (base.indexOf('?') === -1 ? '?' : '&');
      return base + sep + list.join('&');
    }

    // 微信授权跳转地址
    function buildWxAuthUrl() {
      var params = [];
      addParam(params, 'turl', window.location.href);
      addParam(params, 'liveUrl', live_url);
      return buildUrl(AUTH_BASE, params);
    }

    // 把当前页面的 query 原样透传到直播间地址
    function appendPageQuery(url) {
      var params = [];
      new URLSearchParams(window.location.search).forEach(function (value, name) {
        addParam(params, name, value);
      });
      return buildUrl(url, params);
    }

    // wechat
    function isWechatBrowser() { return -1 !== navigator.userAgent.toLowerCase().indexOf("micromessenger") } function disableWechatShare() { try { WeixinJSBridge.call("hideOptionMenu") } catch (e) { console.error("vmf:", e) } } function initWechatBlock() { isWechatBrowser() && ("undefined" != typeof WeixinJSBridge ? disableWechatShare() : document.addEventListener("WeixinJSBridgeReady", disableWechatShare, !1)) } "loading" === document.readyState ? document.addEventListener("DOMContentLoaded", initWechatBlock) : initWechatBlock();

    var isWxAuth = "0";
    var live_url = "https://lkjhijne.yunlidai.com";
    // let live_url = "//82319kbdg.yunlidai.com";
    // let isWxAuth = 1;

    if (!isWechatBrowser()) {
      window.location.href = live_url;
    }
  </script>

<body>

  <!-- <div id="overlay"></div> -->
  <a id="wx_login" href="#">微信授权登陆</a>

  <script>
    var wxLoginLink = document.getElementById('wx_login');
    console.log('lv-2.1_4')
    if (isWxAuth == 1) {
      wxLoginLink.style.display = 'block';
    }
    if (window.location.search.includes('sign')) {
      wxLoginLink.style.display = 'none';
    }
    wxLoginLink.href = buildWxAuthUrl();
  </script>

  <!-- iframe -->
  <iframe id="liveIframe" autoplay allow="autoplay; fullscreen" allowfullscreen src="" frameborder="0"></iframe>

  <script>
    window.addEventListener('DOMContentLoaded', function () {
      var liveIframe = document.getElementById('liveIframe');
      liveIframe.src = window.location.search.includes('sign')
        ? appendPageQuery(live_url || '')
        : live_url;
    });

  </script>
